<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workplace Network - 職場專業誌</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <!-- 頂端列：左邊為職場動態標題與時間天氣膠囊，右邊為帳戶功能表 -->
    <header class="app-header">
      <div class="header-left">
        <h2>職場動態</h2>
        <div id="weatherTimeWidget" class="weather-time-widget">
          <div class="time-display">
            <span id="currentTime">--:--:--</span>
            <span id="currentDate" class="date-sub">----/--/--</span>
          </div>
          <div class="weather-divider"></div>
          <div class="weather-display" id="weatherDisplay">
            <span class="weather-temp" id="weatherTemp">--°C</span>
            <span class="weather-humidity" id="weatherHumidity">濕度 --%</span>
            <span class="weather-uv hidden" id="weatherUV">☀️ UV --</span>
          </div>
        </div>
      </div>
      <div id="authNav" class="auth-nav">
        <!-- JS 動態渲染：登入按鈕 或 帳戶下拉功能表 -->
      </div>
    </header>

    <!-- 職場主題橫幅圖片 (Hero Banner) -->
    <div class="hero-banner">
      <img 
        src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80" 
        alt="團隊開心工作與交流" 
        class="hero-banner-img"
      />
      <div class="hero-banner-overlay">
        <span class="hero-banner-badge"></span>
        <p class="hero-banner-text"></p>
      </div>
    </div>

    <!-- 發文區塊 (LinkedIn 風格工作日常版) -->
    <section id="composeCard" class="compose-box hidden">
      <div class="work-quick-tags">
        <span class="quick-tag-label">💼 專業標籤：</span>
        <button type="button" class="tag-chip" data-insert="[範疇: 業務與流程] ">📋 業務與流程</button>
        <button type="button" class="tag-chip" data-insert="[範疇: 輪班與營運] ">🔄 輪班日常</button>
        <button type="button" class="tag-chip" data-insert="[範疇: 系統與工具] ">💻 系統工具</button>
        <button type="button" class="tag-chip" data-insert="[心得: 效率提升] ">📈 效率提升</button>
      </div>
      <textarea id="postContent" maxlength="280" placeholder="分享工作流程心得、日常營運紀錄或專業技能..."></textarea>
      <div class="compose-actions">
        <span id="charCount">0/280</span>
        <button id="submitBtn">發佈動態</button>
      </div>
    </section>

    <!-- 職場專業動態分類篩選列 -->
    <div class="work-filter-bar">
      <button class="filter-chip active" data-filter="">全部動態</button>
      <button class="filter-chip" data-filter="業務與流程">📋 業務與流程</button>
      <button class="filter-chip" data-filter="輪班與營運">🔄 輪班日常</button>
      <button class="filter-chip" data-filter="系統與工具">💻 系統工具</button>
    </div>

    <!-- 動態列表 -->
    <div id="timeline" class="timeline"></div>

    <!-- 無限滾動監聽哨兵與狀態提示 -->
    <div id="infiniteScrollSentinel" class="infinite-scroll-sentinel">
      <div id="loadingSpinner" class="loading-spinner hidden">
        <div class="spinner-dot"></div>
        <span>載入動態中...</span>
      </div>
      <p id="noMoreMsg" class="no-more-text hidden">已載入全部動態</p>
    </div>
  </div>

  <!-- 登入 / 註冊 彈窗 -->
  <div id="authModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="formTitle">登入職場帳號</h3>
        <button id="closeModalBtn" class="close-btn" type="button">&times;</button>
      </div>
      <div class="form-inputs">
        <input type="text" id="authUsername" placeholder="用戶名 (3-20 字元)" autocomplete="username" />
        <input type="password" id="authPassword" placeholder="密碼 (至少 6 碼)" autocomplete="current-password" />
      </div>
      <div class="form-actions">
        <button id="authPrimaryBtn">登入</button>
        <button id="toggleAuthBtn" class="link-btn" type="button">切換至註冊</button>
      </div>
      <p id="authError" class="error-msg"></p>
    </div>
  </div>

  <!-- 修改密碼 彈窗 -->
  <div id="pwdModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>修改密碼</h3>
        <button id="closePwdModalBtn" class="close-btn" type="button">&times;</button>
      </div>
      <div class="form-inputs">
        <input type="password" id="currentPwdInput" placeholder="目前密碼" autocomplete="current-password" />
        <input type="password" id="newPwdInput" placeholder="新密碼 (至少 6 碼)" autocomplete="new-password" />
        <input type="password" id="confirmPwdInput" placeholder="確認新密碼" autocomplete="new-password" />
      </div>
      <div class="form-actions">
        <button id="submitPwdBtn">確認更新</button>
      </div>
      <p id="pwdError" class="error-msg"></p>
    </div>
  </div>

  <!-- 上傳頭像 彈窗 -->
  <div id="avatarModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>更換專業形象頭像</h3>
        <button id="closeAvatarModalBtn" class="close-btn" type="button">&times;</button>
      </div>
      <div class="avatar-preview-container">
        <div id="avatarPreview" class="avatar-circle-lg"></div>
      </div>
      <div class="form-inputs">
        <input type="file" id="avatarFileInput" accept="image/png, image/jpeg, image/webp" />
      </div>
      <div class="form-actions">
        <button id="submitAvatarBtn">更新頭像</button>
      </div>
      <p id="avatarError" class="error-msg"></p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
